# OpenAPI request schemas use additionalProperties: false unless explicitly documented otherwise.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${AICHAT_DB_URL}
spring.datasource.username=${AICHAT_DB_USERNAME}
spring.datasource.password=${AICHAT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
mybatis.configuration.map-underscore-to-camel-case=true
aichat.security.session-token-key=${AICHAT_SESSION_TOKEN_KEY}
aichat.security.content-master-key=${AICHAT_CONTENT_MASTER_KEY}
aichat.security.content-key-version=${AICHAT_CONTENT_KEY_VERSION:v1}
aichat.features.assessment-enabled=${AICHAT_FEATURE_ASSESSMENT_ENABLED:false}
aichat.assessment.answer-cleanup-ms=${AICHAT_ASSESSMENT_ANSWER_CLEANUP_MS:3600000}
aichat.assessment.answer-cleanup-initial-ms=${AICHAT_ASSESSMENT_ANSWER_CLEANUP_INITIAL_MS:3600000}
