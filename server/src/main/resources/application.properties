# OpenAPI request schemas use additionalProperties: false unless explicitly documented otherwise.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.datasource.url=${AICHAT_DB_URL}
spring.datasource.username=${AICHAT_DB_USERNAME}
spring.datasource.password=${AICHAT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true
mybatis.configuration.map-underscore-to-camel-case=true
aichat.security.session-token-key=${AICHAT_SESSION_TOKEN_KEY}
aichat.security.content-master-key=${AICHAT_CONTENT_MASTER_KEY}
aichat.security.content-key-version=${AICHAT_CONTENT_KEY_VERSION:v1}
aichat.features.assessment-enabled=${AICHAT_FEATURE_ASSESSMENT_ENABLED:false}
aichat.features.generation-enabled=${AICHAT_FEATURE_GENERATION_ENABLED:false}
aichat.features.venting-enabled=${AICHAT_FEATURE_VENTING_ENABLED:false}
aichat.assessment.answer-cleanup-ms=${AICHAT_ASSESSMENT_ANSWER_CLEANUP_MS:3600000}
aichat.assessment.answer-cleanup-initial-ms=${AICHAT_ASSESSMENT_ANSWER_CLEANUP_INITIAL_MS:3600000}
aichat.venting.cleanup-ms=${AICHAT_VENTING_CLEANUP_MS:3600000}
aichat.venting.cleanup-initial-ms=${AICHAT_VENTING_CLEANUP_INITIAL_MS:3600000}
aichat.idempotency.cleanup-ms=${AICHAT_IDEMPOTENCY_CLEANUP_MS:3600000}
aichat.idempotency.cleanup-initial-ms=${AICHAT_IDEMPOTENCY_CLEANUP_INITIAL_MS:3600000}

# Personal virtual payment is distinct from ordinary merchant APIv3 payment.
aichat.virtual-pay.enabled=${AICHAT_VIRTUAL_PAY_ENABLED:false}
aichat.virtual-pay.app-id=${AICHAT_WECHAT_APP_ID:}
aichat.virtual-pay.app-secret=${AICHAT_WECHAT_APP_SECRET:}
aichat.virtual-pay.offer-id=${AICHAT_VIRTUAL_PAY_OFFER_ID:}
aichat.virtual-pay.app-key=${AICHAT_VIRTUAL_PAY_APP_KEY:}
aichat.virtual-pay.push-token=${AICHAT_VIRTUAL_PAY_PUSH_TOKEN:}
aichat.virtual-pay.encoding-aes-key=${AICHAT_VIRTUAL_PAY_ENCODING_AES_KEY:}
aichat.virtual-pay.base-product-id=${AICHAT_VIRTUAL_PAY_BASE_PRODUCT_ID:}
aichat.virtual-pay.career-product-id=${AICHAT_VIRTUAL_PAY_CAREER_PRODUCT_ID:}
aichat.virtual-pay.upgrade-product-id=${AICHAT_VIRTUAL_PAY_UPGRADE_PRODUCT_ID:}
aichat.virtual-pay.base-price-fen=${AICHAT_VIRTUAL_PAY_BASE_PRICE_FEN:2990}
aichat.virtual-pay.career-price-fen=${AICHAT_VIRTUAL_PAY_CAREER_PRICE_FEN:4990}
aichat.virtual-pay.upgrade-price-fen=${AICHAT_VIRTUAL_PAY_UPGRADE_PRICE_FEN:2000}
aichat.virtual-pay.query-delay-ms=${AICHAT_VIRTUAL_PAY_QUERY_DELAY_MS:300000}
