components:
  securitySchemes:
    opaqueBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        短期不透明访问令牌。服务端只保存令牌 hash，并在每次请求校验状态、
        到期、刷新族重放、最低鉴权等级和资源所有权。不是 JWT，不携带用户资料。
    refreshToken:
      type: apiKey
      in: header
      name: X-Refresh-Token
      description: 一次性轮换的高熵刷新令牌；服务端只保存 hash，重放撤销整个刷新族。
    wechatVirtualPaySignature:
      type: apiKey
      in: query
      name: msg_signature
      description: 安全消息使用msg_signature并绑定加密正文；GET地址验证使用signature、timestamp和nonce。
    wechatPaySignature:
      type: apiKey
      in: header
      name: Wechatpay-Signature
      description: |
        微信支付 API v3 通知签名。必须同时校验 Wechatpay-Timestamp、
        Wechatpay-Nonce、Wechatpay-Serial 和原始 HTTP Body，并验证商户、appid、金额和事件幂等。
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 企业 SSO 完成 MFA 后签发的短期运营令牌；必须继续执行 RBAC、审批和审计。

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一业务意图的稳定幂等键；同键不同请求体必须返回 409。
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SessionId:
      $ref: '#/components/parameters/UlidSessionId'
    UlidSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    RunId:
      name: runId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    VentSessionId:
      name: ventSessionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    CheckinStage:
      name: stage
      in: path
      required: true
      schema:
        type: string
        enum: [72h, d7]
    Sku:
      name: sku
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Z0-9_]+$'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    RefundId:
      name: refundId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    DeletionRequestId:
      name: deletionRequestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    WechatpayTimestamp:
      name: Wechatpay-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]{10,13}$'
    WechatpayNonce:
      name: Wechatpay-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    WechatpaySerial:
      name: Wechatpay-Serial
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  headers:
    XRequestId:
      description: 服务端生成或接受的请求关联 ID。
      schema:
        type: string
        maxLength: 128
    RetryAfter:
      description: 客户端再次尝试前应等待的秒数。
      schema:
        type: integer
        minimum: 1

  responses:
    Success:
      description: 请求成功
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Created:
      description: 资源已创建
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Accepted:
      description: 命令已接受并进入明确异步状态
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    BadRequest:
      description: 请求结构或字段无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 凭证缺失、无效、过期、重放或签名验证失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 身份等级、角色、资源所有权、权益或安全状态不允许
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在或为防止枚举而隐藏
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 幂等键、版本或状态转换冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: 请求结构正确但业务前置条件不满足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 请求超过速率、成本或防滥用限制
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 安全、模型、支付或关键配置不可用；服务安全失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Ulid:
      type: string
      minLength: 26
      maxLength: 26
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      examples: [01J00000000000000000000000]
    Meta:
      type: object
      additionalProperties: false
      required: [api_version]
      properties:
        api_version:
          type: string
          const: v1
    SuccessEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error, meta]
      properties:
        request_id:
          type: string
          maxLength: 128
        data:
          type: object
          additionalProperties: true
          description: 当前阶段的领域响应对象；Java 骨架阶段收紧为逐操作 Schema。
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, data, error, meta]
      properties:
        request_id:
          type: string
          maxLength: 128
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ApiError'
        meta:
          $ref: '#/components/schemas/Meta'
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[A-Z0-9_]+$'
        message:
          type: string
          minLength: 1
          maxLength: 200
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
          description: 只允许白名单非敏感字段，不得包含原文、令牌、SQL、堆栈或供应商响应。
    ExpectedVersionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version:
          type: integer
          minimum: 1
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [client_instance_id]
      properties:
        client_instance_id:
          type: string
          minLength: 16
          maxLength: 128
        device_class:
          type: string
          enum: [low, mainstream, unknown]
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [policy_version, adult_confirmed, accepted]
      properties:
        policy_version:
          type: string
          minLength: 1
          maxLength: 64
        adult_confirmed:
          type: boolean
          const: true
        accepted:
          type: boolean
          const: true
    WechatBindRequest:
      type: object
      additionalProperties: false
      required: [login_code, purpose]
      properties:
        login_code:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        purpose:
          type: string
          enum: [payment, cross_device_recovery, reminder, refund]
    CreateAssessmentRunRequest:
      type: object
      additionalProperties: false
      required: [definition_version]
      properties:
        definition_version:
          type: string
          minLength: 1
          maxLength: 64
    AssessmentAnswerRequest:
      type: object
      additionalProperties: false
      required: [expected_version, option_code]
      properties:
        expected_version:
          type: integer
          minimum: 1
        option_code:
          type: string
          minLength: 1
          maxLength: 64
    AssessmentTaskMappingRequest:
      type: object
      additionalProperties: false
      required: [expected_version, context, clarity_pre, confirmed]
      properties:
        expected_version:
          type: integer
          minimum: 1
        context:
          type: string
          enum: [dating_or_partner, family, friendship, workplace, other_relationship]
        clarity_pre:
          type: integer
          minimum: 0
          maximum: 10
        confirmed:
          type: boolean
          const: true
    CreateVentSessionRequest:
      type: object
      additionalProperties: false
      required: [policy_version, confirmed]
      properties:
        policy_version:
          type: string
          minLength: 1
          maxLength: 64
        confirmed:
          type: boolean
          const: true
    VentTurnRequest:
      type: object
      additionalProperties: false
      required: [expected_version, text]
      properties:
        expected_version:
          type: integer
          minimum: 1
        text:
          type: string
          minLength: 1
          maxLength: 2000
          writeOnly: true
    VentSummaryRequest:
      type: object
      additionalProperties: false
      required: [expected_version, summary_version, confirmed, fields]
      properties:
        expected_version:
          type: integer
          minimum: 1
        summary_version:
          $ref: '#/components/schemas/Ulid'
        confirmed:
          type: boolean
          const: true
        fields:
          type: object
          additionalProperties: false
          required: [context, observed_fact, looping_thought, emotion, need_or_boundary, current_goal, clarity_pre]
          properties:
            context:
              type: string
              enum: [dating_or_partner, family, friendship, workplace, other_relationship]
            observed_fact:
              type: string
              minLength: 20
              maxLength: 500
              writeOnly: true
            looping_thought:
              type: string
              maxLength: 500
              writeOnly: true
            emotion:
              type: array
              minItems: 1
              maxItems: 3
              uniqueItems: true
              items:
                type: string
                enum: [anxious, hurt, angry, confused, sad, hopeful, afraid, disappointed, calm, other]
            need_or_boundary:
              type: array
              minItems: 1
              maxItems: 3
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 80
            current_goal:
              type: string
              minLength: 1
              maxLength: 200
              writeOnly: true
            clarity_pre:
              type: integer
              minimum: 0
              maximum: 10
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [entry_type, context, clarity_pre]
      properties:
        entry_type:
          type: string
          enum: [DIRECT, ASSESSMENT, VENT]
        context:
          type: string
          enum: [dating_or_partner, family, friendship, workplace, other_relationship]
        clarity_pre:
          type: integer
          minimum: 0
          maximum: 10
    ClarityFieldsRequest:
      type: object
      additionalProperties: false
      required: [expected_version, fields]
      properties:
        expected_version:
          type: integer
          minimum: 1
        fields:
          type: object
          additionalProperties: false
          required: [context, observed_fact, interpretation, emotion, need_or_boundary, next_step_goal]
          properties:
            context:
              type: string
              enum: [dating_or_partner, family, friendship, workplace, other_relationship]
            observed_fact:
              type: string
              minLength: 20
              maxLength: 500
              writeOnly: true
            interpretation:
              type: string
              maxLength: 500
              writeOnly: true
            emotion:
              type: array
              minItems: 1
              maxItems: 3
              uniqueItems: true
              items:
                type: string
