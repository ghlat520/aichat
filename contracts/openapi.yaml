openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: AIChat API
  version: 0.1.0
  description: |
    关系清晰卡 P0 的业务接口源码。本文件冻结领域所有权、请求边界、错误语义
    和 P0 接口面；操作级鉴权不得在这里逐项维护，而由 auth-rules.yaml 统一分类，
    编译后写入 openapi.generated.json，供文档、代码生成和 CI 安全检查使用。
  contact:
    name: 关系清晰卡产品与工程负责人
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{apiHost}
    description: 按环境注入的 API 主机；不得把生产域名硬编码到契约
    variables:
      apiHost:
        default: api.aichat.invalid
        description: local、test、staging 或 production 的受控主机名

x-auth-levels:
  Public:
    rank: 0
    credential: none
    description: 只允许无敏感数据的静态配置、安全资源和匿名会话创建。
  Visitor:
    rank: 10
    credential: opaqueBearer
    description: 匿名访客短期不透明令牌；Principal 可以访问 Visitor 接口。
  Principal:
    rank: 20
    credential: opaqueBearer
    description: 已完成必要微信身份绑定的主体；服务端仍需校验资源所有权。
  Internal:
    rank: 30
    credential: providerSignatureOrMutualTLS
    description: 支付供应商回调或受控服务身份；不能由普通 Bearer Token 代替。
  Operator:
    rank: 40
    credential: operatorBearer
    description: 经企业 SSO、MFA 和 RBAC 校验的运营身份；每次命令均需审计。

x-operator-rbac:
  required_roles_semantics: any_of
  description: x-required-roles 中任一角色可以进入该操作；多角色列表不表示同一人完成双人审批。
  high_risk_approval: maker-checker
  separation_of_duties: 申请人与审批人 subject 必须不同，审批前不得产生生产效果。

tags:
  - name: Public
    description: 无登录静态配置、安全资源和匿名会话入口。
  - name: Identity
    description: 访客会话、同意、微信身份绑定和令牌轮换。
  - name: Assessment
    description: 六至八题确定性自测、答案和结果映射。
  - name: Venting
    description: 限时限轮深夜倾诉、总结确认和安全前置。
  - name: Clarity
    description: 六字段、镜像确认、两轮反思和关系清晰任务。
  - name: Report
    description: 报告生成、免费摘要和逐报告权益校验读取。
  - name: Action
    description: 四十八小时行动、逐次提醒授权和复盘。
  - name: Catalog
    description: 服务端权威商品、价格版本和有效窗口。
  - name: Ordering
    description: 密封报告之后的订单、成交快照和幂等写入。
  - name: Payment
    description: 微信支付预下单、签名回调和已验证资金事实。
  - name: Refund
    description: 用户退款申请、渠道退款状态和售后协作。
  - name: Privacy
    description: 用户数据地图、导出、分域删除和回执。
  - name: Support
    description: 计费、交付、安全、隐私、纠错和投诉工单。
  - name: Operations
    description: 运营后台的受控查询、审批、配置、发布和审计。

paths:
  /api/v1/app-config:
    get:
      operationId: getAppConfig
      summary: 获取公开应用配置
      tags: [Public]
      x-domain-owner: Operations
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/safety-resources:
    get:
      operationId: getSafetyResources
