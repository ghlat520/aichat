function payment(){const v={pending:['…','正在确认支付','请稍等，我们正在核对这笔订单。<br>不需要再次付款。','wait'],success:['✓','报告已经准备好了','付款已确认，你的说明书可以打开了。<br>之后也可以从“我的报告”找回。',''],cancel:['×','这次购买已取消','还没有完成付款。<br>免费测评结果和经历都还在。','failure'],failed:['!','本次支付未完成','支付已明确结束。<br>可以返回确认页再试，或继续免费使用。','failure'],delivery:['…','付款已收到，正在交付','这份报告还在恢复交付中。<br>请勿重复购买，可在订单中查看处理进度。','wait']}[state.payment];return `${head('购买结果','order','订单状态')}<section class="payment-state"><div class="state-icon ${v[3]}">${v[0]}</div><h2>${v[1]}</h2><p>${v[2]}</p></section><div class="card"><div class="price-line"><span>商品</span><span>${state.product==='career'?'职业探索报告':'个人优势说明书'}</span></div><div class="price-line"><span>${state.product==='career'&&state.paid?'本次补差':'本次金额'}</span><span>¥${money(orderAmount())}</span></div><div class="price-line"><span>订单</span><span>演示订单 1026</span></div><div class="price-line"><span>交付</span><span>${state.payment==='success'?'已就绪':state.payment==='delivery'?'处理中':'付款确认后解锁'}</span></div></div>${state.payment==='success'?goButton('查看我的完整报告',state.product==='career'?'career-report':'report'):state.payment==='pending'?primary('查询这笔订单','query-order'):state.payment==='delivery'?goButton('查看交付与售后进度','order'):goButton('返回购买确认','checkout')}${goButton('回到我的结果','reports','secondary')}${state.payment==='pending'?'<p class="footer-note">本轮可在右侧切换状态，或点查询体验确认成功。</p>':''}`}
function fullReport(){if(!canReadBase()&&!state.previewOnly)return `${head('个人优势说明书','reports')}<div class="empty">${icon('cards')}<h2>先了解这份报告</h2><p>基础结果继续免费查看，<br>想看更完整的场景建议，可以先浏览预览。</p>${goButton('查看报告预览','preview')}${goButton('回到免费结果','discover','secondary')}</div>`;const ex=actualExp();return `${head(state.oldVersion?'历史报告 v1.0':'个人优势说明书','reports',state.previewOnly?'完整样例':'已购报告')}${state.previewOnly?'<div class="soft-note">以下为完整报告样例，展示目录与内容密度，不是你的真实测评结论。</div>':''}<div class="report-header"><span class="tag ${state.previewOnly?'gray':'aqua'}">${state.previewOnly?'样例阅读':`已购 · 可重复查看`}</span><h2>温柔地理解，<br>清楚地行动。</h2><p class="tiny">个人优势说明书 · v${state.oldVersion?'1.0':state.version}<br>2026.10.26 · 目标：${esc(state.goals.join('、')||'协作')}</p></div>${state.calibrated&&!state.oldVersion?`<div class="soft-note"><strong>这次修订采纳了你的补充</strong><br>${esc(state.calibrationText||'已调整经历理解和场景建议。')}<br><span class="tiny">量表得分未变，原版 v1.0 仍可查看。</span></div>`:''}<div class="report-actions"><button data-action="save-report">${icon('cards')}${state.reportSaved?'已保存在我的报告':'保存报告'}</button><button data-go="share">${icon('leaf')}分享预览</button></div><article class="report-paper"><section class="report-section"><h3>这份报告基于什么</h3><p>性格特质结果、优势测评与两段${state.confirmed?'本人确认':'示例'}经历，共同组成这次分析的基础。${state.results.mbti?'16 型人格作为补充偏好信息纳入。':'本次未纳入 16 型人格，不补写人格类型。'}</p><div class="tags" style="margin-top:12px"><span class="tag aqua">测评数据</span><span class="tag">本人陈述</span><span class="tag pink">系统推断</span></div><p class="report-source">测评：原型样例版本 v1，2026.10.26<br>经历：${state.confirmed?'本人已确认':'示例内容'} · 报告为本次结果快照</p></section><section class="report-section"><h3>我的性格与行为画像</h3><p>在这份样例里，你既愿意理解新的可能，也会留意他人的体验。面对复杂任务，你更容易在有准备、有目标的沟通里发挥；持续、临时的情绪协调则可能让你消耗。</p><p class="report-source">依据：开放性与宜人性倾向、两段经历的行动及能量感受。它是当前线索，仍会随环境变化。</p></section><section class="report-section"><h3>值得发展的三项优势</h3>${strengthData.map(([name,desc,basis],i)=>`<h4>${i+1}. ${name} <span class="inference">优势候选</span></h4><p>${desc}</p><div class="evidence"><label>${state.confirmed?'本人确认':'示例'}经历 ${i===2?2:1}</label>${esc(ex[i===2?1:0].action)}</div><p class="report-source">${basis}适合把任务缩小后，在下一次真实情境中核对。</p>`).join('')}</section><section class="report-section"><h3>容易发挥与容易消耗的环境</h3><h4>更容易发挥</h4><p>目标可讨论、有安静整理时间、愿意互相确认理解的合作。你不必包办全部协调，可以先贡献一份结构清楚的说明。</p><h4>更容易消耗</h4><p>长期目标模糊、反复被打断、需要不断猜测别人期待的任务。若发现自己持续加班来替大家澄清问题，可以先确认职责边界。</p></section><section class="report-section"><h3>优势过度使用与盲点</h3><p>理解别人，不意味着总要替别人承担。整理信息也可能变成反复推敲，迟迟不交付。可以先问“这次做到什么程度就足够？”，再给自己设一个停止点。</p><p class="report-source">待验证：你是否真的存在这些消耗？若与你的经历不符，可在校准中修正。</p></section><section class="report-section"><h3>我的${esc(state.goals[0]||'协作')}场景建议</h3><p>在下次需要共同推进的小任务中，先花 10 分钟，把目标、已知信息和待确认问题写在一页纸上。邀请对方补充，确认分工后再推进。</p><p class="report-source">来自经历 1 中“澄清与整理”的做法；如果对方更适合口头交流，可先聊再记，不必坚持书面形式。</p></section><section class="report-section"><h3>未来七天，选一件小事</h3><p>不用三件都做。选一个适合当前节奏的练习，把新发现放回生活。</p>${actionData.map(([title,body,observe],i)=>`<div class="action-card"><h4>${title}</h4><p>${body}</p><p style="margin-top:8px;color:#879891">观察与调整：${observe}</p><button data-action-index="${i}">${state.actionStarted&&state.selectedAction===i?'已选这个练习':'选这个练习'}</button></div>`).join('')}</section><section class="report-section"><h3>校准与复盘</h3><p>你可以在服务窗口内集中指出一次不符合实际的解读，再记录一次行动后的新发现。解释可以调整，你也可以保留自己的不同理解。</p></section></article>${!state.previewOnly?`<section class="service-card"><div class="between"><strong>${state.expired?'本次服务窗口已结束':'7 天服务，按你的节奏使用'}</strong><span class="tag white">${state.expired?'可继续阅读':'还剩 7 天'}</span></div><p style="margin-top:8px">${state.expired?'已购报告仍可重复查看和保存，校准与复盘记录也会保留。':`集中校准 ${state.calibrated?'已使用':'1 次可用'} · 行动复盘 ${state.reflected?'已完成':'1 次可用'}<br>本次服务至 2026.11.02，不含持续陪伴。`}</p><div class="button-pair">${goButton(state.calibrated?'查看校准记录':'校准不符合的内容','calibrate','secondary')}${goButton(state.reflected?'查看复盘记录':'开始行动复盘','reflection','secondary')}</div></section><button class="menu-row" data-go="career">${icon('leaf')}探索适合自己的工作方向<span class="chevron" style="margin-left:auto">${icon('next')}</span></button>`:goButton('回到报告预览','preview','secondary')}<p class="version-line">${state.calibrated?`当前 v${state.version} · <button class="text-link" data-action="old-version">查看原版 v1.0</button>`:'这是当前输入形成的一份快照，新的测评不会覆盖它。'}</p>`}
function calibrate(){return `${head('校准这份解读','report')}<p class="eyebrow">说明书服务 · 一次集中校准</p><h2 class="page-title">不符合你的地方，<br>可以直接告诉我们。</h2><p class="lead">先把不符合的内容集中写下来，再补充实际情况。一次提交会生成一份修订报告。</p>${state.calibrated?`<div class="card"><span class="tag aqua">已完成校准</span><h3 class="title-sm" style="margin-top:14px">修订版 v${state.version} 已保存</h3><p class="small" style="margin-top:9px">${esc(state.calibrationText||'已根据你确认的新信息调整了解读。')}</p><p class="tiny" style="margin-top:12px">量表得分保持原样，修订了经历理解与应用建议。原版 v1.0 仍可查看。</p></div>${goButton('打开修订报告','report')}`:`${state.expired?'<div class="notice">本次 7 天服务已结束。报告仍可查看，内容错误与交付问题可从售后入口反馈。</div>':''}<label class="field"><span>想校准哪一部分？</span><select><option>优势的解释与适用条件</option><option>对我经历的理解</option><option>场景建议或行动</option><option>使用我确认的新测评结果</option></select></label>${field('calibrationText','哪里不符合？实际情况是什么？','例如：我不是不喜欢团队交流，而是不适应没有准备的临时会议。',state.calibrationText)}<div class="soft-note">校准解释与个人经历，不会静默改变测评得分。一次集中提交后，原版与修订版都会保留。</div>${state.calibrationError?'<div class="notice error">这次修订还没有完成，内容已保留，校准资格没有消耗。</div>':''}${primary(state.calibrationError?'重新提交校准':'提交这次集中校准','submit-calibration',state.expired)}${goButton('先回去读一读','report','secondary')}`}`}
function reflection(){return `${head('七天里的一个小变化','report')}<span class="tag aqua">${state.reflected?'复盘已保存':'行动复盘 · 1 次'}</span><h2 class="page-title" style="margin-top:14px">试过之后，<br>有什么新发现？</h2><p class="lead">不是为了完成打卡，而是看看这个练习是否真的适合你。</p><div class="day-strip">${Array.from({length:7},(_,i)=>`<span class="day ${state.actionStarted&&i===0?'done':''}">第 ${i+1} 天</span>`).join('')}</div><div class="card"><p class="tiny">我选择的小练习</p><h3 class="title-sm" style="margin:7px 0">${actionData[state.selectedAction][0]}</h3><p class="small">${actionData[state.selectedAction][1]}</p></div>${state.expired&&!state.reflected?'<div class="notice">本次服务窗口已结束。你仍可查看报告和已有的行动记录。</div>':''}${field('reviewText','我实际尝试了什么？','写一个具体片段，没做成也可以如实记录。',state.reviewText)}${field('reviewOutcome','发生了什么变化？','哪些有帮助，哪些与你预想的不同？',state.reviewOutcome)}${field('reviewNext','接下来，我想保留或调整什么？','一个很小的调整就可以。',state.reviewNext)}${state.reflected?'<div class="free-banner">这次行动复盘已保存，可以从“我的报告”重新查看。</div>':primary('保存这次复盘','submit-reflection',state.expired)}${goButton('回到我的说明书','report','secondary')}`}
function career(){return `${head('职业探索','report','第二期')}<span class="tag aqua">把偏好放回现实条件</span><h2 class="page-title" style="margin-top:14px">适合的方向，<br>可以一步步试出来。</h2><p class="lead">在已有优势的基础上，再了解你的兴趣、重视的事和现实条件。补充这些信息不额外收费。</p><div class="card"><h3 class="title-sm">你的基础画像已带入</h3><p class="small" style="margin-top:8px">性格特质、优势主题、两段确认经历，${state.results.mbti?'及 16 型人格偏好':'本次未纳入 16 型人格'}。</p></div><div class="field-label">哪些事情会让你想继续了解？</div><div class="chips">${['理解人','整理信息','创造内容','动手实践','分析问题','组织协作'].map(t=>`<button class="chip ${state.careerInterest.includes(t)?'selected':''}" data-interest="${t}">${t}</button>`).join('')}</div><div class="field-label" style="margin-top:23px">工作中，你更重视什么？</div><div class="chips">${['自主空间','帮助他人','稳定节奏','持续学习','创造表达','收入成长'].map(t=>`<button class="chip ${state.careerValues.includes(t)?'selected':''}" data-value="${t}">${t}</button>`).join('')}</div>${field('skills','已经有的技能与相关经历','写下你做过的事、能独立完成的任务。',state.skills)}${field('careerGoal','当前想探索什么？','如在现岗位调整任务，或尝试一个新方向。',state.careerGoal)}${field('careerTime','近期可投入的时间','如每周 3 小时，不确定也可写暂不清楚。',state.careerTime,'text')}${field('careerConstraints','需要照顾的现实条件','可填写工作经历、地点、收入需要或暂不考虑的方向。',state.careerConstraints)}<div class="soft-note">未提供的条件会保持未知。结果会比较多个方向，并说明哪些还需要你亲自验证。</div>${primary(state.careerPaid?'查看我的职业报告':state.paid?`查看职业报告预览 · 预计补差 ¥${money(Math.max(0,49.9-state.baseNet))}`:'查看职业报告预览 · ¥49.90','career-preview')}<p class="footer-note">第二期交付原型；职业方向是探索线索，<br>不会只凭人格类型给出唯一答案。</p>`}

度。本次包含一次校准和 7 天内一次复盘，不代表 30 天连续陪伴。</div>${goButton('查看包含的个人优势内容','report','secondary')}${goButton('校准或复盘这份报告','calibrate','secondary')}`:`<div class="card"><h3 class="title-sm">完整职业报告还包含</h3><ul class="delivery-list"><li>其余 2 个探索方向与支持、冲突条件</li><li>三个方向的比较和能力差距</li><li>30 天自主探索计划</li><li>个人优势内容、一次校准和 7 天复盘</li></ul></div><div class="purchase-box"><div class="price-line"><span>职业探索报告</span><span>¥49.90</span></div>${state.paid?`<div class="price-line credit"><span>已购基础报告实付抵扣</span><span>− ¥${money(Math.min(49.9,state.baseNet))}</span></div>`:''}<div class="price-detail"><div><p class="tiny">${state.paid?'本次补差':'一次购买'}</p><div class="price" style="margin-top:7px"><small>¥</small>${money(state.paid?Math.max(0,49.9-state.baseNet):49.9)}</div></div><span class="tag aqua">预览已就绪</span></div>${primary(state.paid?'确认补差与升级内容':'查看购买内容','buy-career')}<button class="quiet-button" data-go="career">先继续免费整理</button></div>`}`}

else if(a==='privacy')sheet('你可以管理自己的内容','<p>分享前先预览，私人经历默认不加入分享卡。个人报告可以保存或删除；订单记录与免费结果分别保留。</p>',goButton('管理我的报告','reports').replace('data-go="reports"','data-action="privacy-reports"')+'<button class="quiet-button" data-action="close-sheet">关闭</button>');
else if(a==='privacy-reports'){closeSheet();go('reports')}
else if(a==='relationship-preview')sheet('这次关系整理',`<p><strong>我能确认的事实</strong><br>${esc(state.relationship.fact||'先写下一件你能确认的小事。')}</p><p><strong>我的感受与需要</strong><br>${esc(state.relationship.feeling||'留意此刻的感受。')}<br>${esc(state.relationship.need||'想想你最在意的需要。')}</p><p><strong>下一步的小行动</strong><br>${esc(state.relationship.step||'找一个由自己掌握的小行动。')}</p>`,primary('先留在这里','close-sheet'));
else if(a==='spec-map')sheet('页面与需求对照','<p>三项测评与完整免费结果：第 4、5 节。<br>经历、综合画像与优势说明书：第 6 节。<br>购买、补差、校准与复盘：第 7 节。<br>支付状态、我的报告与售后：第 8 节。<br>职业探索：第 9 节，第二期原型。</p><p>原始说明书保留在项目 docs/AICHAT_SELF_ASSESSMENT_PRODUCT_SPEC_2026-10-26.md。本轮页面不修改该说明书。</p>',primary('回到页面','close-sheet'));
else if(a==='close-sheet')closeSheet();
}
function downloadText(name,content){const u=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(handleSocialClick(b))return;if(b.dataset.reviewPage){reviewJump(b.dataset.reviewPage);return}if(b.dataset.reviewStep){const i=pageMeta.findIndex(m=>m[0]===page);reviewJump(pageMeta[(i+Number(b.dataset.reviewStep)+pageMeta.length)%pageMeta.length][0]);return}if(b.dataset.preset){state=defaults();const p=b.dataset.preset;if(p==='new'){state.results={};state.answers={mbti:[],traits:[],strengths:[]};state.index=0;go('discover')}else if(p==='ready'){fillReady();go('portrait')}else if(p==='paid'){fillReady();state.paid=true;state.bound=true;state.payment='success';go('report')}else if(p==='career'){fillReady();state.paid=true;state.bound=true;state.product='career';state.payment='success';go('career')}else go('discover');closeSheet();return}if(b.dataset.scenario){scenario(b.dataset.scenario);return}if(b.dataset.tool){state.tool=b.dataset.tool;go(b.dataset.toolPage||'intro');return}if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.answer){state.selected=Number(b.dataset.answer);render({keepScroll:true});if(state.autoNext){clearTimeout(answerTimer);const index=state.index;answerTimer=setTimeout(()=>{if(page==='question'&&state.index===index)saveAnswer()},220)}return}if(b.dataset.goal){toggle(state.goals,b.dataset.goal);render({keepScroll:true});return}if(b.dataset.interest){toggle(state.careerInterest,b.dataset.interest);render({keepScroll:true});return}if(b.dataset.value){toggle(state.careerValues,b.dataset.value);render({keepScroll:true});return}if(b.dataset.filter){state.reportFilter=b.dataset.filter;render();return}if(b.dataset.support){state.supportReason=b.dataset.support;render({keepScroll:true});return}if(b.dataset.refundScope){state.refundScope=b.dataset.refundScope;render({keepScroll:true});return}if(b.dataset.actionIndex!==undefined){state.selectedAction=Number(b.dataset.actionIndex);state.actionStarted=true;go('reflection');return}if(b.dataset.action)handleAction(b.dataset.action)});
function toggle(list,item){const i=list.indexOf(item);if(i<0)list.push(item);else list.splice(i,1)}
document.addEventListener('input',e=>{const path=e.target.dataset.store;if(!path)return;const bits=path.split('.');let owner=state;for(let i=0;i<bits.length-1;i++)owner=owner[bits[i]];owner[bits.at(-1)]=e.target.value;if(path==='posterName'&&document.querySelector('.poster-sender'))document.querySelector('.poster-sender').textContent=(state.posterName||'探索中的我')+' · 想听听你的看法';if(path.startsWith('experiences.'))state.confirmed=false});
document.addEventListener('change',e=>{if(e.target.id==='auto-next'){state.autoNext=e.target.checked;render({keepScroll:true})}if(e.target.id==='page-select')reviewJump(e.target.value);if(e.target.dataset.share){state.share[e.target.dataset.share]=e.target.checked;render({keepScroll:true})}});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const text=$('#chat-input').value.trim();if(!text)return;state.messages.push({user:true,text},{user:false,text:'可以从这个具体片段开始。那一次，你做了什么？哪些是可以确认的，哪些还是你的猜测？'});render();$('#viewport').scrollTop=$('#viewport').scrollHeight}});
document.addEventListener('keydown',e=>{if(!$('#overlay').hidden){if(e.key==='Escape'){e.preventDefault();closeSheet()}if(e.key==='Tab'){const list=[...$('#sheet').querySelectorAll('button,a,input,textarea,select')].filter(el=>!el.disabled);if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0]?.focus()}}return}if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const i=pageMeta.findIndex(m=>m[0]===page);reviewJump(pageMeta[(i+(e.key==='ArrowRight'?1:-1)+pageMeta.length)%pageMeta.length][0])}});
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeSheet()});
if(page!=='discover')reviewJump(page);else render();
</script>
</body></html>
