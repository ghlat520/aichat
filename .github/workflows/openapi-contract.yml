name: OpenAPI Contract

on:
  pull_request:
    branches: [main]
    paths:
      - contracts/openapi.yaml
      - contracts/openapi.generated.json
      - contracts/auth-rules.yaml
      - contracts/redocly.yaml
      - contracts/compile-auth-rules.mjs
      - contracts/compile-auth-rules.test.mjs
      - contracts/check-auth-contract.mjs
      - contracts/generate-api-skeleton.mjs
      - server/**
      - miniprogram/services/api/**
      - .github/workflows/openapi-contract.yml
  push:
    branches: [main]
    paths:
      - contracts/openapi.yaml
      - contracts/openapi.generated.json
      - contracts/auth-rules.yaml
      - contracts/redocly.yaml
      - contracts/compile-auth-rules.mjs
      - contracts/compile-auth-rules.test.mjs
      - contracts/check-auth-contract.mjs
      - contracts/generate-api-skeleton.mjs
      - server/**
      - miniprogram/services/api/**
      - .github/workflows/openapi-contract.yml

permissions:
  contents: read

jobs:
  lint:
    name: Validate OpenAPI and auth policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Bundle authoring contract
        env:
          REDOCLY_TELEMETRY: 'off'
          REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'
        run: >-
          npx --yes @redocly/cli@2.39.0 bundle
          contracts/openapi.yaml
          --output="$RUNNER_TEMP/aichat-openapi-source.json"
          --ext=json
      - name: Test central auth rule compiler
        run: node --test contracts/compile-auth-rules.test.mjs
      - name: Compile central auth rules into explicit OpenAPI
        run: >-
          node contracts/compile-auth-rules.mjs
          "$RUNNER_TEMP/aichat-openapi-source.json"
          contracts/auth-rules.yaml
          contracts/openapi.generated.json
      - name: Reject compiled-contract drift
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- contracts/openapi.generated.json)" ]]; then
            git diff -- contracts/openapi.generated.json
            git status --short -- contracts/openapi.generated.json
            exit 1
          fi
      - name: Lint compiled OpenAPI 3.1 contract
        env:
          REDOCLY_TELEMETRY: 'off'
          REDOCLY_SUPPRESS_UPDATE_NOTICE: 'true'
        run: >-
          npx --yes @redocly/cli@2.39.0 lint
          --config=contracts/redocly.yaml
          --format=github-actions
          contracts/openapi.generated.json
      - name: Verify auth levels, schemes, RBAC and idempotency
        run: >-
          node contracts/check-auth-contract.mjs
          contracts/openapi.generated.json
      - name: Regenerate Spring and mini-program contract surfaces
        run: >-
          node contracts/generate-api-skeleton.mjs
          contracts/openapi.generated.json
      - name: Reject generated-code drift
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- server/src/main/java/com/aichat miniprogram/services/api)" ]]; then
            git diff -- server/src/main/java/com/aichat miniprogram/services/api
            git status --short -- server/src/main/java/com/aichat miniprogram/services/api
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile Spring Boot and run contract/auth tests
        run: >-
          mvn --file server/pom.xml
          --batch-mode --no-transfer-progress test
      - name: Type-check mini-program client
        run: >-
          npx --yes -p typescript@5.9.3
          tsc -p miniprogram/services/api/tsconfig.json

  breaking-change:
    name: Reject breaking API changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch pull request base branch
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
      - name: Detect whether a baseline contract exists
        id: baseline
        shell: bash
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:contracts/openapi.generated.json"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "First contract introduction: syntax/auth lint remains mandatory; diff starts after merge."
          fi
      - name: Compare base and revision contracts
        if: steps.baseline.outputs.exists == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: 'origin/${{ github.base_ref }}:contracts/openapi.generated.json'
          revision: 'HEAD:contracts/openapi.generated.json'
          fail-on: WARN
          include-checks: api-security-removed
